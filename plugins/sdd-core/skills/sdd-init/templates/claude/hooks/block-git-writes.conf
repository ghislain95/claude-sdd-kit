# Settings for block-git-writes.sh (plain KEY=value, never executed). docs/CONTRIBUTING.md §2.
# Branches that never take a direct commit or push, only a merge (regex alternation).
PROTECTED_BRANCHES={{DEFAULT_BRANCH}}|master
# 1 = the agent pushes its change branches (never a protected one); 0 = every git push is blocked
# and a human pushes (a project without a remote the agent may push to).
# sdd:if github
ALLOW_PUSH=1
# sdd:endif
# sdd:if !github
ALLOW_PUSH=0
# sdd:endif
# Method of the agent's only merge route, `gh pr merge <n> --<method>`: squash or merge, one the
# repository allows. rebase is refused: the deploy guard needs the default branch before the merge
# as one commit, and a rebase merge leaves no such commit. Whether the agent may merge a pull request
# is not a setting: the hook checks merge-conditions on GitHub (success, gates: none) before every
# agent merge, and a pull request with an open gate is merged by the owner.
MERGE_METHOD={{MERGE_METHOD}}
# 1 = `git push --force-with-lease` allowed to a change branch (never a protected one); 0 = blocked
# like any force-push.
ALLOW_FORCE_WITH_LEASE=0
