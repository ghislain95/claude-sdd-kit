# merge-conditions — the single check a merge depends on.
#
# Posts the commit status `merge-conditions` on the pull request's head commit:
#   success  every CI workflow the diff requires succeeded on the head commit (the required set is
#            computed from the path filters of the workflows on main, so a pull request
#            no filter covers is still judged), `review-harness` and `opsx-verify` are success on
#            the head commit (change pull requests only), and every trigger hit of the diff is
#            accounted for by the approved classification;
#   pending  a required workflow or status has not finished or not arrived yet;
#   failure  anything else, with the reason.
# The description always starts with the gates: `gates: none | intent | irreversible |
# intent+irreversible | framing | unclassified`. Only `gates: none` may be merged by the agent.
#
# Safety: `pull_request_target`, `workflow_run` and `status` all run the definition on the default
# branch, so a pull request cannot edit its own check. The job checks out the default branch only and
# fetches the pull request head as data: its files are read with git, nothing from it is executed.
# Matcher and tests: .sdd/bin/merge_conditions.py (a copy of the sdd-init template). Schemas:
# plugins/sdd-core/skills/sdd-init/templates/docs/OPENSPEC_GUIDE.md. Keep `workflow_run.workflows` in
# step with the workflows that run on pull_request (today: Tooling).
name: Merge conditions

on:
  pull_request_target:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ 'main' ]
  workflow_run:
    workflows: [ 'Tooling' ]
    types: [ completed ]
  status:

permissions:
  contents: read
  statuses: write
  pull-requests: read
  actions: read
  checks: read

concurrency:
  group: merge-conditions-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.event.sha }}
  cancel-in-progress: true

jobs:
  judge:
    # React to the agent's own statuses only (the statuses this job posts never trigger a run).
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'status' && (github.event.context == 'review-harness' || github.event.context == 'opsx-verify'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The default branch, never the pull request head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml==6.0.2

      - name: Judge the pull request and post merge-conditions
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          STATUS_SHA: ${{ github.event.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request_target) target=(--pr "$PR_NUMBER") ;;
            workflow_run)        target=(--sha "$RUN_HEAD_SHA") ;;
            status)              target=(--sha "$STATUS_SHA") ;;
            *) echo "Unsupported event $EVENT_NAME"; exit 1 ;;
          esac
          python3 .sdd/bin/merge_conditions.py check \
            --repo "$GITHUB_REPOSITORY" --default-branch "$DEFAULT_BRANCH" "${target[@]}"
